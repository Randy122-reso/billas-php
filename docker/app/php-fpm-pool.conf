; Billas v4 — php-fpm pool.
; FPM listens on loopback only; nginx is the sole client. clear_env=no is
; required so Docker/Compose environment variables reach the application.

[www]
user = appuser
group = appuser

listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 3M
php_admin_value[expose_php] = Off
php_admin_value[date.timezone] = Asia/Jakarta
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 96
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.save_comments] = 1

; Sessions are stored in SQLite by SqliteSessionHandler, but PHP still needs a
; writable save path for pre-boot/edge cases.
php_admin_value[session.save_path] = /tmp
