# Billas v4 — nginx front server.
# Only /app/public is exposed. The SQLite database, vendor tree, source and
# logs live outside the document root and are additionally denied below.

user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  billas  '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log  /dev/stdout billas;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream billas_php {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    # Cloudflare terminates TLS and forwards X-Forwarded-Proto. PHP only needs
    # a boolean HTTPS flag; nginx must never put the raw header into $_SERVER.
    map $http_x_forwarded_proto $billas_https {
        default off;
        https   on;
    }

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root  /app/public;
        index index.php;

        # Never serve dotfiles, environment files, database or source.
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location ^~ /data/    { deny all; return 404; }
        location ^~ /vendor/  { deny all; return 404; }
        location ^~ /src/     { deny all; return 404; }
        location ^~ /views/   { deny all; return 404; }
        location ^~ /db/      { deny all; return 404; }
        location ^~ /config/  { deny all; return 404; }
        location ^~ /logs/    { deny all; return 404; }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param HTTPS           $billas_https;
            fastcgi_param HTTP_PROXY      "";
            fastcgi_pass  billas_php;
            fastcgi_index index.php;
            fastcgi_read_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
            fastcgi_busy_buffers_size 64k;
        }

        # Long-lived polling endpoints should not be cached by Cloudflare.
        location ~ ^/(api|wifi|internal|health|ready) {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Security headers are also set by SecurityHeadersMiddleware; these
        # cover static assets and early nginx-generated errors.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
